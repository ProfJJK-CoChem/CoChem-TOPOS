[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cochem-topos"
version = "0.1.0"
description = "Traceable molecular search, conformer review, and scientific export"
authors = [{name = "Dr. Joshua John Klaassen"}, {name = "CoChem Team"}]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "CoChem-BASE>=1.0.1,<2",
  "numpy>=1.24", "scipy>=1.11", "networkx>=3.1", "pydantic>=2.4",
  "h5py>=3.9", "mendeleev>=0.20", "psutil>=5.9", "filelock>=3.13",
  "MolSym>=1.2,<2",
  "ase>=3.29,<4",
  "qcengine==0.51.0", "qcelemental==0.51.2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.37"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "build>=1.2", "setuptools>=77", "wheel>=0.45"]
external = ["qcengine==0.51.0", "qcelemental==0.51.2"]

[project.scripts]
cochem-topos = "topos.cli:main"
cochem-topos-release = "topos.release:main"
topos-ui = "topos.ui:ui_main"

[project.entry-points."cochem.modules"]
topos = "topos.base_provider:provider"

[tool.setuptools]
py-modules = ["cochem_topos_web"]

[tool.setuptools.packages.find]
where = ["."]
include = ["topos*"]
exclude = ["tests*", "notebooks*", "build*", "dist*"]

[tool.setuptools.package-data]
"topos.data" = ["*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a real external scientific engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "build", "dist", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
