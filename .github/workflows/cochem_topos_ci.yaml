name: CoChem-TOPOS CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Enforce Air-Gap Policy
      run: |
        echo "Verifying no restricted artifact files are tracked or present in repository..."
        RESTRICTED_REGEX='\.(h5|hdf5|gbw|tmp|parquet|sqlite|db|scf|engrad|hess|prop|densities|opt|trj|out|log|err|xyz|mol|sdf)$|cochem_system_config\.json$|cochem_deployment_manifest\.json$|cochem_mint_registry\.json$'
        OFFENDING_FILES=$(git ls-files -c -o --exclude-standard | grep -iE "$RESTRICTED_REGEX" | grep -vE "^tests/.*fixtures/" || true)
        if [ -n "$OFFENDING_FILES" ]; then
          echo "CRITICAL: Restricted files found in repository. Air-Gap policy violated."
          echo "Offending restricted files:"
          echo "$OFFENDING_FILES"
          exit 1
        fi
        echo "Air-Gap integrity verified: No restricted files detected."

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint and Type Check
      run: |
        ruff check .
        mypy .

    - name: Run Unit Tests with Coverage
      run: |
        pytest tests/ -v --cov=cascade_engine --cov=core_engine --cov=export_utils --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80

    - name: Upload Test Coverage Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-python-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
          .coverage
        include-hidden-files: true