name: Canonical structural ownership wheel

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-structural-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-BASE
          ref: b05f7b048eff39bedf63019c8f371bdde5b5579a
          path: .cochem-dependencies/base
          persist-credentials: false
      - name: Install the reviewed BASE dependency and verification tools
        run: |
          test "$(git -C .cochem-dependencies/base rev-parse HEAD)" = b05f7b048eff39bedf63019c8f371bdde5b5579a
          python -m pip install .cochem-dependencies/base '.[dev]'
      - name: Build and install the actual noneditable TOPOS wheel
        run: |
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/structural-dist"
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/structural-dist/*.whl
          sha256sum "$RUNNER_TEMP"/structural-dist/*.whl > structural-wheel.sha256
          python -m pip freeze --all > structural-dependencies.txt
          python -m pip check
      - name: Verify unchanged chemistry cases and the real file process boundary
        run: >-
          python -I -m pytest --import-mode=importlib
          tests/v010/test_structural_ownership.py
          tests/v010/test_structural_boundary.py
          --basetemp="$RUNNER_TEMP/structural-native"
          --junitxml=structural-wheel.xml
      - name: Retain wheel identity and authentic structural evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: structural-installed-wheel
          path: |
            structural-wheel.xml
            structural-wheel.sha256
            structural-dependencies.txt
            ${{ runner.temp }}/structural-dist/*.whl
            ${{ runner.temp }}/structural-native/**/request.json
            ${{ runner.temp }}/structural-native/**/result.json
          if-no-files-found: error
          retention-days: 14
