name: Licensed ORCA hosted acceptance (BASE integration)

# Compatibility entry point. All provisioning and scientific execution is owned
# by the mandatory BASE/TOPOS/TORQ acceptance workflow.
on:
  workflow_dispatch:
    inputs:
      base_commit:
        description: Exact reviewed CoChem-BASE Git commit; final installer acceptance requires catalog B
        required: true
        type: string
        default: 35f97a1b7a6a294f381b4a30780c5b3a766b537d

permissions:
  contents: read

jobs:
  mandatory-ecosystem-acceptance:
    if: github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/topos_orca_acceptance.yml
    with:
      base_commit: ${{ inputs.base_commit || '35f97a1b7a6a294f381b4a30780c5b3a766b537d' }}
      include_goat: true
      include_counterpoise: true
    secrets:
      asset_credential: ${{ secrets[vars.COCHEM_ORCA_ASSET_CREDENTIAL] }}
      COCHEM_SOURCE_READ_TOKEN: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
