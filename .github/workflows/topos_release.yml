name: Prepare and verify unsigned TOPOS release candidate

on:
  workflow_dispatch:
    inputs:
      hosted_acceptance_run_id:
        description: Completed TOPOS ORCA acceptance run with GOAT and counterpoise evidence
        required: false
        type: string
      hosted_acceptance_repository:
        description: Repository that executed the licensed acceptance run
        required: true
        type: choice
        default: ProfJJK-CoChem/CoChem-BASE
        options:
          - ProfJJK-CoChem/CoChem-BASE
          - ProfJJK-CoChem/CoChem-TOPOS
      hosted_acceptance_run_attempt:
        description: Exact attempt of the selected native acceptance run
        required: true
        type: string
        default: '1'

permissions:
  contents: read
  actions: read

concurrency:
  group: topos-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COCHEM_HEADLESS: '1'
      QT_QPA_PLATFORM: offscreen
      COCHEM_CPU_ALLOCATION_POLICY: github_hosted_vcpus
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-BASE
          ref: 705b9d54370d5089da286a02b7a1c4afdcbafec1
          token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
          path: .cochem-dependencies/base
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-TORQ
          ref: 79fbb111125e50627a1a2c129888a45496f368d4
          token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
          path: .cochem-dependencies/torq
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build identical candidate archives twice and actual companion wheels
        run: |
          python -m pip install -r scripts/release-build-requirements.txt
          python scripts/build_release.py --output "$RUNNER_TEMP/topos-candidate"
          python scripts/build_ml_worker.py --output "$RUNNER_TEMP/topos-candidate/ml-worker"
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/wheelhouse" .cochem-dependencies/base
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/wheelhouse" .cochem-dependencies/torq
          cp "$RUNNER_TEMP"/topos-candidate/*.whl "$RUNNER_TEMP/wheelhouse/"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'wheelhouse'
          (root / 'SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n'
              for p in sorted(root.glob('*.whl'))))
          PY
      - name: Install reviewed mandatory wheel set and all eleven BASE phases
        run: |
          python scripts/setup_ecosystem.py \
            --base-root "$GITHUB_WORKSPACE/.cochem-dependencies/base" \
            --torq-root "$GITHUB_WORKSPACE/.cochem-dependencies/torq" \
            --artifacts "$RUNNER_TEMP/cochem-release-runtime" \
            --wheelhouse "$RUNNER_TEMP/wheelhouse" --min-disk-space-gb 1
      - name: Verify another clean noneditable installation and genuine BASE workflow
        run: |
          python scripts/accept_installed_release.py \
            --wheelhouse "$RUNNER_TEMP/wheelhouse" \
            --registry "$RUNNER_TEMP/cochem-release-runtime/Registry/cochem_system_config.json" \
            --output "$RUNNER_TEMP/installed-release"
      - name: Retrieve explicitly selected licensed scientific acceptance evidence
        if: inputs.hosted_acceptance_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.hosted_acceptance_repository == 'ProfJJK-CoChem/CoChem-BASE' && format('topos-orca-acceptance-{0}-{1}', inputs.hosted_acceptance_run_id, inputs.hosted_acceptance_run_attempt) || format('topos-orca-acceptance-{0}', inputs.hosted_acceptance_run_id) }}
          repository: ${{ inputs.hosted_acceptance_repository }}
          run-id: ${{ inputs.hosted_acceptance_run_id }}
          github-token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN || github.token }}
          path: ${{ runner.temp }}/hosted-acceptance
      - name: Require complete current SRS, matrix, regression and licensed evidence
        if: always()
        env:
          HOSTED_ACCEPTANCE_REPOSITORY: ${{ inputs.hosted_acceptance_repository }}
          HOSTED_ACCEPTANCE_RUN_ID: ${{ inputs.hosted_acceptance_run_id }}
          HOSTED_ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.hosted_acceptance_run_attempt }}
        run: |
          runtime="$RUNNER_TEMP/cochem-release-runtime/ui-env/bin/python"
          if test ! -x "$runtime"; then
            echo 'Release certification blocked: mandatory wheel installation failed.' >&2
            exit 3
          fi
          supplements=()
          native_pytest="$RUNNER_TEMP/hosted-acceptance/topos-orca-evidence/pytest-receipt.json"
          if test -f "$native_pytest"; then
            supplements+=(--supplemental-validation "$native_pytest")
          fi
          "$runtime" -m topos.release gate \
            --source-root "$GITHUB_WORKSPACE" \
            --validation .docs/TOPOS_COMPLETION_VALIDATION.json \
            --srs-acceptance .docs/TOPOS_SRS_ACCEPTANCE.json \
            --distribution-manifest "$RUNNER_TEMP/topos-candidate/distribution-manifest.json" \
            --installation "$RUNNER_TEMP/installed-release/acceptance/installed-acceptance.json" \
            --hosted "$RUNNER_TEMP/hosted-acceptance/topos-orca-evidence/acceptance.json" \
            --hosted-extended "$RUNNER_TEMP/hosted-acceptance/topos-orca-extended/acceptance.json" \
            --hosted-repository "$HOSTED_ACCEPTANCE_REPOSITORY" \
            --hosted-run-id "$HOSTED_ACCEPTANCE_RUN_ID" \
            --hosted-run-attempt "$HOSTED_ACCEPTANCE_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/topos-candidate/release-gate.json" "${supplements[@]}"
      - name: Retain candidate archives and separate evidence without publishing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: topos-unsigned-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/topos-candidate/
            ${{ runner.temp }}/wheelhouse/
            ${{ runner.temp }}/installed-release/clean-install.json
            ${{ runner.temp }}/installed-release/acceptance/
            ${{ runner.temp }}/cochem-release-runtime/mandatory-validation.json
            ${{ runner.temp }}/cochem-release-runtime/setup-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
