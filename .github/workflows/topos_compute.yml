name: TOPOS calculation through CoChem-BASE
run-name: ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      base_commit:
        description: Exact reviewed CoChem-BASE Git commit; final installer acceptance requires catalog B
        required: true
        type: string
        default: 14202e182e1fa4f99258ed32a8ae9ba8c1c565ad
      dispatch_id:
        description: Unique request correlation ID
        required: true
        type: string
      request_b64:
        description: Canonical TOPOS request JSON encoded as base64 (maximum 50 KB)
        required: true
        type: string
      request_sha256:
        description: Canonical request SHA-256
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: topos-compute-${{ inputs.dispatch_id }}
  cancel-in-progress: false

jobs:
  calculation:
    if: github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: cochem-student-tests
    env:
      BASE_COMMIT: ${{ inputs.base_commit || '14202e182e1fa4f99258ed32a8ae9ba8c1c565ad' }}
      ORCA_CLOUD_LICENSE_CONFIRMED: ${{ vars.ORCA_CLOUD_LICENSE_CONFIRMED }}
      TOPOS_DISPATCH_ID: ${{ inputs.dispatch_id }}
      TOPOS_REQUEST_B64: ${{ inputs.request_b64 }}
      TOPOS_REQUEST_SHA256: ${{ inputs.request_sha256 }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QT_QPA_PLATFORM: offscreen
      COCHEM_HEADLESS: '1'
      COCHEM_CPU_ALLOCATION_POLICY: github_hosted_vcpus
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate the exact BASE source commit
        shell: bash
        run: |
          if [[ ! "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'BASE source must be an exact lowercase 40-character Git commit.' >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-BASE
          ref: ${{ env.BASE_COMMIT }}
          token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN || github.token }}
          path: .cochem-dependencies/base
          persist-credentials: false
      - name: Verify the checked-out BASE source identity
        shell: bash
        run: |
          actual_base_commit="$(git -C .cochem-dependencies/base rev-parse HEAD)"
          test "$actual_base_commit" = "$BASE_COMMIT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-TORQ
          ref: 4f323800227dbde00ffb082bd6d9e44d851e1c7a
          token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN || github.token }}
          path: .cochem-dependencies/torq
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate the request before provisioning
        id: request
        run: |
          python -m pip install 'pydantic>=2.4'
          python -m topos.actions.hosted_requirements
      - name: Require private licensed provisioning configuration
        if: steps.request.outputs.licensed == 'true'
        shell: bash
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          ASSET_CREDENTIAL_NAME: ${{ vars.COCHEM_ORCA_ASSET_CREDENTIAL }}
          ASSET_CREDENTIAL: ${{ secrets[vars.COCHEM_ORCA_ASSET_CREDENTIAL] }}
        run: |
          test "$REPOSITORY_PRIVATE" = true
          test "$ORCA_CLOUD_LICENSE_CONFIRMED" = true
          if [[ ! "$ASSET_CREDENTIAL_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo 'Configure COCHEM_ORCA_ASSET_CREDENTIAL in this private controller.' >&2
            exit 1
          fi
          if test -z "$ASSET_CREDENTIAL"; then
            echo 'The configured private ORCA distribution credential is unavailable.' >&2
            exit 1
          fi
      - name: Prepare the mandatory ecosystem and external artifact paths
        run: |
          echo "COCHEM_ARTIFACT_DIR=$RUNNER_TEMP/cochem-artifacts" >> "$GITHUB_ENV"
          echo "COCHEM_CONFIG=$RUNNER_TEMP/cochem-artifacts/Registry/cochem_system_config.json" >> "$GITHUB_ENV"
          echo "COCHEM_TORQ_ROOT=$GITHUB_WORKSPACE/.cochem-dependencies/torq" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes build-essential libgfortran5
      - name: Reserve disk for the complete licensed distribution
        if: steps.request.outputs.licensed == 'true'
        env:
          RUNNER_HOST_KIND: ${{ runner.environment }}
        run: |
          test "$RUNNER_HOST_KIND" = github-hosted
          test "$RUNNER_OS" = Linux
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
      - uses: ./.cochem-dependencies/base/.github/actions/setup-orca
        if: steps.request.outputs.licensed == 'true'
        with:
          asset-token: ${{ secrets[vars.COCHEM_ORCA_ASSET_CREDENTIAL] }}
      - name: Install and audit the mandatory BASE, TOPOS and TORQ package
        run: |
          python scripts/setup_ecosystem.py \
            --base-root "$GITHUB_WORKSPACE/.cochem-dependencies/base" \
            --torq-root "$GITHUB_WORKSPACE/.cochem-dependencies/torq" \
            --artifacts "$COCHEM_ARTIFACT_DIR" --min-disk-space-gb 1
      - name: Execute the correlated TOPOS request through BASE
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" -m topos.actions.compute_worker \
            --output-root "$RUNNER_TEMP/topos-runs" --evidence-root "$RUNNER_TEMP/topos-evidence"
      - name: Retain verified scientific records and the correlation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: topos-evidence-${{ inputs.dispatch_id }}
          path: ${{ runner.temp }}/topos-evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Remove the licensed installation
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/cochem-orca-install" "$RUNNER_TEMP/cochem-orca-download"
