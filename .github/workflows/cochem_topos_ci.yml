name: CoChem-TOPOS CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Air-Gap Enforcement
        run: |
          if [ -n "$(find . -type f \( -name "*.h5" -o -name "*.gbw" -o -name "*.xyz" -o -name "cochem_system_config.json" \))" ]; then
            echo "Air-Gap Violation: Forbidden files found in the repository."
            exit 1
          fi
        shell: bash

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and Type Check
        run: |
          ruff check .
          mypy .

      - name: Run Unit Tests with Coverage
        run: |
          pytest tests/ -v --cov=cascade_engine --cov=core_engine --cov=export_utils --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: Upload Test Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
            .coverage
          include-hidden-files: true
