name: CoChem-TOPOS verification
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      base_commit:
        description: Exact reviewed CoChem-BASE Git commit; final installer acceptance requires catalog B
        required: true
        type: string
        default: 14202e182e1fa4f99258ed32a8ae9ba8c1c565ad
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_COMMIT: ${{ inputs.base_commit || '14202e182e1fa4f99258ed32a8ae9ba8c1c565ad' }}
      # A missing executable is a CI failure, never a successful skipped test.
      TOPOS_REQUIRE_REAL_ENGINES: '1'
      TOPOS_EXECUTION_BACKEND: development
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Validate the exact BASE source commit
        shell: bash
        run: |
          if [[ ! "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'BASE source must be an exact lowercase 40-character Git commit.' >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-BASE
          ref: ${{ env.BASE_COMMIT }}
          token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
          path: .cochem-dependencies/base
          persist-credentials: false
      - name: Verify the checked-out BASE source identity
        shell: bash
        run: |
          actual_base_commit="$(git -C .cochem-dependencies/base rev-parse HEAD)"
          test "$actual_base_commit" = "$BASE_COMMIT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-TORQ
          ref: 4f323800227dbde00ffb082bd6d9e44d851e1c7a
          token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
          path: .cochem-dependencies/torq
          persist-credentials: false
      - name: Install mandatory packages and verification tools
        run: |
          python -m pip install -e .cochem-dependencies/base -e .cochem-dependencies/torq -e '.[dev,ui,external]'
      - name: Install checksum-pinned genuine xTB
        run: |
          python scripts/install_xtb.py "$RUNNER_TEMP/topos-tools"
          echo "TOPOS_XTB_EXECUTABLE=$RUNNER_TEMP/topos-tools/xtb" >> "$GITHUB_ENV"
      - name: Install checksum-pinned genuine CREST
        run: |
          python scripts/install_crest.py "$RUNNER_TEMP/topos-crest"
          echo "TOPOS_CREST_EXECUTABLE=$RUNNER_TEMP/topos-crest/crest" >> "$GITHUB_ENV"
      - name: Lint and check dependencies
        run: |
          python -m ruff check topos frontend scripts tests setup.py cochem_topos_web.py
          python -m pip check
      - name: Test mathematical, failure, storage, UI, and real engine paths
        # These two actual BASE installation suites run without skips in the
        # mandatory CoChem package acceptance job; transport tests remain here.
        run: >-
          python -m pytest
          --ignore=tests/v010/test_base_integration.py
          --ignore=tests/v010/test_base_provider.py
          --junitxml=verification.xml --cov=topos --cov-report=term-missing --cov-report=xml
      - name: Build distributable
        run: python -m build --outdir "$RUNNER_TEMP/topos-dist"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-python-${{ matrix.python }}
          path: |
            verification.xml
            coverage.xml
          if-no-files-found: error
          retention-days: 7
